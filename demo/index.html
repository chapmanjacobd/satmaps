<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Satmaps MVP: Land / Ocean layer toggle demo</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,0.92); border-radius: 8px;
    padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-size: 13px; min-width: 220px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; }
  #panel label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
  #panel input[type="range"] { width: 120px; }
  #panel .row { display: flex; align-items: center; gap: 6px; }
  #panel .row .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #888; }
  #panel .hint { color: #666; font-size: 11px; margin-top: 8px; line-height: 1.4; }
  #panel button { margin-top: 8px; }
  #panel select { width: 100%; margin-bottom: 8px; padding: 4px; }
  .fade { color: #999; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Layer toggle demo (z13)</h1>
  <select id="area-select">
    <option value="hawaii" selected>Hawaii</option>
    <option value="greenland">Greenland east-coast sliver</option>
  </select>
  <div class="row">
    <label>
      <input type="checkbox" id="toggle-land" checked />
      <span class="swatch" style="background:#3f7a34"></span>
      Land
    </label>
  </div>
  <div class="row">
    <label>
      <input type="checkbox" id="toggle-ocean" checked />
      <span class="swatch" style="background:#1a4f8b"></span>
      Ocean
    </label>
  </div>
  <div class="row" style="margin-top:6px">
    <span class="fade">Ocean opacity</span>
    <input type="range" id="ocean-opacity" min="0" max="1" step="0.05" value="1" />
  </div>
  <div class="hint">
    Two independent PMTiles per area: <code>&lt;area>.pmtiles</code> (land, RGBA transparent
    over water) and <code>&lt;area>.ocean.pmtiles</code> (ocean, RGBA transparent over
    land). Toggle each layer to see independent control. Drag to pan, scroll to zoom.
  </div>
</div>
<script>
  // Load PMTiles as a MapLibre protocol so raster sources can read them directly.
  const pmtilesProtocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", pmtilesProtocol.tile);

  function pmtilesUrl(name) {
    const url = new URL(name, window.location.href);
    return "pmtiles://" + url.href + "/{z}/{x}/{y}";
  }

  const AREAS = {
    hawaii: {
      label: "Hawaii",
      land: "hawaii.pmtiles",
      ocean: "hawaii.ocean.pmtiles",
      center: [-157.2, 21.3],
      zoom: 9,
      maxzoom: 13,
      bounds: [[-158.5, 20.6], [-156.0, 22.0]],
    },
    greenland: {
      label: "Greenland east-coast sliver",
      land: "greenland.pmtiles",
      ocean: "greenland.ocean.pmtiles",
      center: [-37.3, 82.0],
      zoom: 8,
      maxzoom: 13,
      bounds: [[-37.6, 80.6], [-37.0, 84.9]],
    },
  };

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        ocean: {
          type: "raster",
          tiles: [pmtilesUrl(AREAS.hawaii.ocean)],
          tileSize: 512,
          maxzoom: 13,
          attribution: "GEBCO",
        },
        land: {
          type: "raster",
          tiles: [pmtilesUrl(AREAS.hawaii.land)],
          tileSize: 512,
          maxzoom: 13,
          attribution: "Copernicus Sentinel-2",
        },
      },
      layers: [
        // Background fill so fully toggled-off states still show something.
        { id: "bg", type: "background", paint: { "background-color": "#0a2a4a" } },
        { id: "land", type: "raster", source: "land", paint: { "raster-opacity": 1 } },
        { id: "ocean", type: "raster", source: "ocean", paint: { "raster-opacity": 1 } },
      ],
    },
    center: AREAS.hawaii.center,
    zoom: AREAS.hawaii.zoom,
    maxZoom: 13,
  });

  const landEl = document.getElementById("toggle-land");
  const oceanEl = document.getElementById("toggle-ocean");
  const opacityEl = document.getElementById("ocean-opacity");
  const areaEl = document.getElementById("area-select");

  function applyArea(key) {
    const area = AREAS[key];
    // MapLibre has no map.setSource; remove and re-add both raster sources and layers.
    map.removeLayer("ocean");
    map.removeLayer("land");
    map.removeSource("ocean");
    map.removeSource("land");
    map.addSource("land", {
      type: "raster",
      tiles: [pmtilesUrl(area.land)],
      tileSize: 512,
      maxzoom: area.maxzoom,
      attribution: "Copernicus Sentinel-2",
    });
    map.addSource("ocean", {
      type: "raster",
      tiles: [pmtilesUrl(area.ocean)],
      tileSize: 512,
      maxzoom: area.maxzoom,
      attribution: "GEBCO",
    });
    map.addLayer({ id: "ocean", type: "raster", source: "ocean", paint: { "raster-opacity": 1 } });
    map.addLayer({ id: "land", type: "raster", source: "land", paint: { "raster-opacity": 1 } }, "ocean");
    // Re-apply current toggle state (layers are fresh after re-add).
    map.setLayoutProperty("ocean", "visibility", oceanEl.checked ? "visible" : "none");
    map.setLayoutProperty("land", "visibility", landEl.checked ? "visible" : "none");
    map.setPaintProperty("ocean", "raster-opacity", parseFloat(opacityEl.value));
    map.easeTo({ center: area.center, zoom: area.zoom, duration: 600 });
  }

  areaEl.addEventListener("change", () => applyArea(areaEl.value));

  oceanEl.addEventListener("change", () => {
    map.setLayoutProperty("ocean", "visibility", oceanEl.checked ? "visible" : "none");
  });
  landEl.addEventListener("change", () => {
    map.setLayoutProperty("land", "visibility", landEl.checked ? "visible" : "none");
  });
  opacityEl.addEventListener("input", () => {
    map.setPaintProperty("ocean", "raster-opacity", parseFloat(opacityEl.value));
  });
</script>
</body>
</html>
