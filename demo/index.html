<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Satmaps MVP: Land / Ocean layer toggle demo</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,0.92); border-radius: 8px;
    padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-size: 13px; min-width: 220px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; }
  #panel label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
  #panel input[type="range"] { width: 120px; }
  #panel .row { display: flex; align-items: center; gap: 6px; }
  #panel .row .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #888; }
  #panel .hint { color: #666; font-size: 11px; margin-top: 8px; line-height: 1.4; }
  #panel button { margin-top: 8px; }
  .fade { color: #999; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Layer toggle demo (z13, Hawaii)</h1>
  <div class="row">
    <label>
      <input type="checkbox" id="toggle-ocean" checked />
      <span class="swatch" style="background:#1a4f8b"></span>
      Ocean
    </label>
  </div>
  <div class="row">
    <label>
      <input type="checkbox" id="toggle-land" checked />
      <span class="swatch" style="background:#3f7a34"></span>
      Land
    </label>
  </div>
  <div class="row">
    <label>
      <input type="checkbox" id="toggle-hillshade" checked />
      <span class="swatch" style="background:#8b8b8b"></span>
      Ocean hillshade (alpha)
    </label>
  </div>
  <div class="row" style="margin-top:6px">
    <span class="fade">Ocean opacity</span>
    <input type="range" id="ocean-opacity" min="0" max="1" step="0.05" value="1" />
  </div>
  <div class="hint">
    Two independent PMTiles: <code>ocean-hawaii.pmtiles</code> (RGBA, transparent over land)
    and <code>land-hawaii.pmtiles</code> (RGBA, transparent over water).
    Toggle each layer to see independent control. Drag to pan, scroll to zoom.
  </div>
</div>
<script>
  // Load PMTiles as a MapLibre protocol so raster sources can read them directly.
  const pmtilesProtocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", pmtilesProtocol.tile);

  function pmtilesUrl(name) {
    const url = new URL(name, window.location.href);
    return "pmtiles://" + url.href + "/{z}/{x}/{y}";
  }

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        ocean: {
          type: "raster",
          tiles: [pmtilesUrl("ocean-hawaii.pmtiles")],
          tileSize: 512,
          minzoom: 6,
          maxzoom: 13,
          attribution: "GEBCO",
        },
        land: {
          type: "raster",
          tiles: [pmtilesUrl("land-hawaii.pmtiles")],
          tileSize: 512,
          minzoom: 5,
          maxzoom: 13,
          attribution: "Copernicus Sentinel-2",
        },
      },
      layers: [
        // Background fill so fully toggled-off states still show something.
        { id: "bg", type: "background", paint: { "background-color": "#0a2a4a" } },
        { id: "land", type: "raster", source: "land", paint: { "raster-opacity": 1 } },
        { id: "ocean", type: "raster", source: "ocean", paint: { "raster-opacity": 1 } },
      ],
    },
    center: [-157.2, 21.3],
    zoom: 10,
    maxZoom: 13,
  });

  const oceanEl = document.getElementById("toggle-ocean");
  const landEl = document.getElementById("toggle-land");
  const hillEl = document.getElementById("toggle-hillshade");
  const opacityEl = document.getElementById("ocean-opacity");

  oceanEl.addEventListener("change", () => {
    map.setLayoutProperty("ocean", "visibility", oceanEl.checked ? "visible" : "none");
  });
  landEl.addEventListener("change", () => {
    map.setLayoutProperty("land", "visibility", landEl.checked ? "visible" : "none");
  });
  hillEl.addEventListener("change", () => {
    // The ocean layer itself is the hillshaded base; toggling it on/off is the
    // full ocean layer. This checkbox just mirrors ocean visibility for clarity.
    map.setLayoutProperty("ocean", "visibility", hillEl.checked ? "visible" : "none");
    if (oceanEl.checked !== hillEl.checked) oceanEl.checked = hillEl.checked;
  });
  opacityEl.addEventListener("input", () => {
    map.setPaintProperty("ocean", "raster-opacity", parseFloat(opacityEl.value));
  });
</script>
</body>
</html>
